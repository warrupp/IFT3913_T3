name: main jdk17 build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

jobs:
  # Tache 3 : on lance semgrep avant le build. Le but c'est de faire echouer
  # le CI seulement si le commit ajoute une NOUVELLE vulnerabilite. Tika a deja
  # des alertes semgrep dans son code, donc on compare avec le commit d'avant
  # (--baseline-commit) pour ne pas bloquer a cause de celles qui existaient deja.
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SEMGREP_VERSION: '1.185.0'
      SEMGREP_RULES: '--config p/java --config p/security-audit --config p/secrets'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # il faut tout l'historique sinon semgrep trouve pas le commit de base

      - name: Install Semgrep
        run: pipx install "semgrep==${SEMGREP_VERSION}"

      - name: Determine baseline commit
        id: baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
          fi
          # si c'est une nouvelle branche, github donne 000...0 comme "before",
          # dans ce cas (ou si le commit existe pas) on prend juste le commit parent
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          echo "Baseline commit: $BASE"
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/semgrep-reports"

      - name: Semgrep scan (new findings only)
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          semgrep scan $SEMGREP_RULES --metrics=off \
            --baseline-commit "$BASELINE_SHA" \
            --error \
            --json-output="$RUNNER_TEMP/semgrep-reports/semgrep-nouvelles.json" \
            --sarif-output="$RUNNER_TEMP/semgrep-reports/semgrep-nouvelles.sarif"

      # rapport complet (toutes les alertes, pas juste les nouvelles), il sert
      # juste pour comparer avant/apres dans le rapport, il fait pas echouer le job
      - name: Semgrep full report
        if: always()
        run: |
          semgrep scan $SEMGREP_RULES --metrics=off \
            --json-output="$RUNNER_TEMP/semgrep-reports/semgrep-complet.json" \
            --sarif-output="$RUNNER_TEMP/semgrep-reports/semgrep-complet.sarif" \
            --quiet > /dev/null

      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-reports
          path: ${{ runner.temp }}/semgrep-reports/
          if-no-files-found: warn

  build:
    needs: semgrep   # le build part seulement si semgrep passe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Build with Maven
        run: mvn clean apache-rat:check test install javadoc:aggregate -Pci -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run E2E Tests
        run: mvn -pl tika-e2e-tests -am clean verify -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
